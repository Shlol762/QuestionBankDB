name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure critical deps are installed even if missing from requirements.txt
          pip install fastapi uvicorn sqlmodel asyncpg pydantic-settings python-jose[cryptography] passlib[bcrypt] slowapi
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Format check with Black
        run: black --check .

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint (ESLint)
        run: npm run lint
        
      - name: Type Check (TypeScript)
        run: npx tsc --noEmit
